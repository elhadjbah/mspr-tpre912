apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Autoriser les connexions depuis les pods avec le label app=cofrap
  - from:
    - podSelector:
        matchLabels:
          app: cofrap
    ports:
    - protocol: TCP
      port: 5432
  # Autoriser les connexions depuis les pods avec le label app=backend
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 5432
  # Autoriser les connexions depuis les pods avec le label app=api
  - from:
    - podSelector:
        matchLabels:
          app: api
    ports:
    - protocol: TCP
      port: 5432
  egress:
  # Autoriser toutes les connexions sortantes (pour les requêtes DNS, etc.)
  - {} 